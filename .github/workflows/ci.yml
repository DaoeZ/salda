name: CI

on:
  push:
    # La rama de trabajo actual no es `main`, así que sin esto la CI solo
    # corría al abrir un PR y los push quedaban sin verificar.
    branches: [main, 'codex/**', 'claude/**']
  pull_request:

jobs:
  dart:
    name: Paquetes Dart + app Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Version FIJA, no "stable": el canal se mueve y un dia el build
          # dejaria de reproducir lo verificado. Debe coincidir con `.fvmrc`.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolver workspace
        run: flutter pub get
      - name: Tokens generados al día
        run: |
          dart run design_tokens:generate --check
          git diff --exit-code -- packages/design_tokens/lib apps/guest_web/src/styles
      - name: Análisis estático
        run: dart analyze --fatal-infos
      - name: Tests de paquetes
        run: |
          for pkg in packages/domain packages/ocr_parser packages/ai_providers packages/design_tokens; do
            if [ -d "$pkg/test" ]; then (cd "$pkg" && dart test); fi
          done
      - name: Tests de la app
        working-directory: apps/mobile
        run: |
          if [ -d test ]; then flutter test; fi

  # Compila para demostrar que el proyecto ENSAMBLA en un entorno limpio.
  # El artefacto NO es instalable sobre la app existente y no sirve para
  # probar Google Sign-In ni los App Links: la CI no tiene —ni debe tener—
  # la clave de desarrollo compartida, así que Gradle firma con la keystore
  # local del runner y el certificado es otro. Se pide explícitamente con
  # `-PallowLocalDebugKeystore=true` para que quede claro que es una
  # excepción consciente y no un descuido; sin esa bandera el build se
  # detiene a propósito (ver app/build.gradle.kts).
  #
  # Los APK que se instalan y se validan se generan en local, con la clave
  # real: docs/SETUP_NUEVO_ORDENADOR.md §7. Subir la keystore a la CI —como
  # secret o como artifact— convertiría cualquier acceso al repositorio en
  # acceso al certificado, así que no se hace.
  apk:
    name: Compila el APK (firma del runner, NO instalable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Version FIJA, no "stable": el canal se mueve y un dia el build
          # dejaria de reproducir lo verificado. Debe coincidir con `.fvmrc`.
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - name: Resolver workspace
        run: flutter pub get
      - name: Compilar APK de desarrollo
        working-directory: apps/mobile
        run: >
          flutter build apk --debug --dart-define=SALDA_ENV=development
          -PallowLocalDebugKeystore=true
      - name: Dejar constancia de con qué certificado ha salido
        run: |
          APK=apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          sha256sum "$APK"
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' || true
          echo "Recordatorio: este certificado NO es el de desarrollo compartido."

  guest-web:
    name: Web de invitados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guest_web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/guest_web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Presupuesto de peso (gzip)
        run: npm run check:size

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm test # compila y ejecuta los vectores dorados (paridad con Dart)

  rules:
    name: Reglas de Firestore y Storage (Emulator Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/firestore/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache del emulador de Firestore
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm install -g firebase-tools
      - run: npm ci --prefix backend/firestore
      - name: Tests de la matriz de autorización (spec §13.2)
        run: >
          firebase emulators:exec --only firestore,storage --project demo-salda
          "npm --prefix backend/firestore test"
