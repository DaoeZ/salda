name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite publicar el APK de una rama concreta para probarla en un
  # dispositivo real sin esperar a que se fusione.
  workflow_dispatch:

jobs:
  dart:
    name: Paquetes Dart + app Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolver workspace
        run: flutter pub get
      - name: Tokens generados al día
        run: |
          dart run design_tokens:generate
          git diff --exit-code -- packages/design_tokens/lib apps/guest_web/src/styles
      - name: Análisis estático
        run: dart analyze --fatal-infos
      - name: Tests de paquetes
        run: |
          for pkg in packages/domain packages/ocr_parser packages/ai_providers packages/design_tokens; do
            if [ -d "$pkg/test" ]; then (cd "$pkg" && dart test); fi
          done
      - name: Tests de la app
        working-directory: apps/mobile
        run: |
          if [ -d test ]; then flutter test; fi

  apk:
    name: APK debug salda-dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolver workspace
        run: flutter pub get
      - name: Compilar APK de desarrollo
        working-directory: apps/mobile
        run: flutter build apk --debug --dart-define=SALDA_ENV=development
      - name: Preparar artefacto verificable
        run: |
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk salda-p7-dev-debug.apk
          sha256sum salda-p7-dev-debug.apk | tee salda-p7-dev-debug.apk.sha256
      # La huella de la FIRMA (distinta del hash del archivo) es lo que Google
      # compara para emitir el token: si no coincide con la registrada en el
      # proyecto Firebase, el selector de cuentas se abre y el login falla.
      # Publicarla aquí convierte esa comprobación en algo verificable.
      - name: Huella de firma del APK
        run: |
          keytool -printcert -jarfile salda-p7-dev-debug.apk \
            | grep -E 'SHA1:|SHA256:' | tee salda-p7-dev-debug.apk.firma
          {
            echo '### Firma del APK de desarrollo'
            echo '```'
            cat salda-p7-dev-debug.apk.firma
            echo '```'
            echo 'Debe estar registrada en Firebase (salda-dev) para el paquete `dev.salda.salda_mobile`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: salda-p7-dev-debug
          path: |
            salda-p7-dev-debug.apk
            salda-p7-dev-debug.apk.sha256
            salda-p7-dev-debug.apk.firma
          if-no-files-found: error
          retention-days: 30
      # Los artifacts caducan y exigen sesión iniciada; la release da un
      # enlace estable y descargable para probar en un dispositivo real.
      - name: Publicar release de desarrollo
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-apk --yes --cleanup-tag || true
          gh release create dev-apk \
            salda-p7-dev-debug.apk \
            salda-p7-dev-debug.apk.sha256 \
            salda-p7-dev-debug.apk.firma \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de desarrollo (salda-dev)" \
            --notes "$(printf 'Build de depuracion de %s\n\nSHA-256 del APK:\n```\n%s\n```\n\nHuella de firma:\n```\n%s\n```\n' \
              "$GITHUB_SHA" "$(cat salda-p7-dev-debug.apk.sha256)" "$(cat salda-p7-dev-debug.apk.firma)")"

  guest-web:
    name: Web de invitados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/guest_web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/guest_web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Presupuesto de peso (gzip)
        run: npm run check:size

  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
      - run: npm test # compila y ejecuta los vectores dorados (paridad con Dart)

  rules:
    name: Reglas de Firestore (Emulator Suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/firestore/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Cache del emulador de Firestore
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - run: npm install -g firebase-tools
      - run: npm ci --prefix backend/firestore
      - name: Tests de la matriz de autorización (spec §13.2)
        run: >
          firebase emulators:exec --only firestore --project demo-salda
          "npm --prefix backend/firestore test"
